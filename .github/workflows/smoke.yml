name: smoke
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 22 * * *' # 毎日 07:00 JST
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # push時はVercelのデプロイ完了を待ってから本番を叩く
      - if: github.event_name == 'push'
        run: sleep 180
      - run: node scripts/smoke.mjs
